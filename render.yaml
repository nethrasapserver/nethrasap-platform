# Render Blueprint — the WHOLE Nethrasap platform on Render via Docker:
# API + worker + Redis + storefront + dashboard. Database is Neon (external).
# Cloudflare (custom domains / CDN / R2) is layered on at the very end.
#
# Deploy: Render Dashboard → New → Blueprint → connect the GitHub repo.
# Render reads this file from the repo root. See infra/DEPLOY.md for the
# full walkthrough and the env vars you must fill in (the `sync: false` ones).
#
# Service URLs are deterministic from the names below:
#   API        https://nethrasap-api.onrender.com
#   Storefront https://nethrasap-storefront.onrender.com
#   Dashboard  https://nethrasap-dashboard.onrender.com
# If any name is already taken globally, Render appends a suffix — update the
# NEXT_PUBLIC_API_BASE / CORS_ORIGINS values below to match.

envVarGroups:
  - name: nethrasap-shared
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Neon pooled connection string. Paste in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # Shared JWT secret (generated once, used by api + worker).
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL_MIN
        value: "15"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      # SMS: console prints OTPs to logs. Switch to msg91/exotel/twilio + keys later.
      - key: SMS_PROVIDER
        value: console
      - key: SMS_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        value: NTHRSP
      # Object storage (Cloudflare R2). Fill when R2 is enabled.
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        value: nethrasap
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false
      # First ops login — set once for the initial deploy, remove after the
      # admin exists and the password has been rotated in the dashboard.
      - key: BOOTSTRAP_ADMIN_PHONE
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # Payments (Razorpay). Fill with test keys, then live keys at go-live.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

services:
  # --- Redis (pub/sub for realtime + arq queue + rate limiting) ---
  - type: keyvalue
    name: nethrasap-redis
    plan: starter
    ipAllowList: [] # internal-only (reachable by api + worker on the private network)

  # --- API + WebSocket hub ---
  - type: web
    name: nethrasap-api
    runtime: docker
    dockerfilePath: ./infra/Dockerfile.backend
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /api/v1/health
    # Runs against the NEW image before it takes traffic — safe & idempotent.
    # bootstrap_admin creates the first admin from BOOTSTRAP_ADMIN_* env vars
    # and self-skips once any admin exists (or when the vars are unset).
    preDeployCommand: "alembic upgrade head && python -m scripts.seed_rbac && python -m scripts.bootstrap_admin"
    envVars:
      - fromGroup: nethrasap-shared
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nethrasap-redis
          property: connectionString
      # Browser origins allowed to call the API (the two frontend services).
      # Update if the service names/URLs differ, or add custom domains later.
      - key: CORS_ORIGINS
        value: https://nethrasap-storefront.onrender.com,https://nethrasap-dashboard.onrender.com

  # --- Background worker (SMS, invoice/payslip PDFs, payroll, webhooks) ---
  - type: worker
    name: nethrasap-worker
    runtime: docker
    dockerfilePath: ./infra/Dockerfile.backend
    dockerContext: .
    dockerCommand: "arq app.worker.WorkerSettings"
    plan: starter
    region: singapore
    envVars:
      - fromGroup: nethrasap-shared
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nethrasap-redis
          property: connectionString

  # --- Storefront (customer Next.js app, Docker) ---
  # APP + NEXT_PUBLIC_API_BASE are declared as ARG in Dockerfile.frontend and
  # Render passes matching env vars as Docker build args. NEXT_PUBLIC_API_BASE
  # is baked into the client bundle so the browser calls the API directly.
  - type: web
    name: nethrasap-storefront
    runtime: docker
    dockerfilePath: ./infra/Dockerfile.frontend
    dockerContext: .
    plan: starter
    region: singapore
    envVars:
      - key: APP
        value: storefront
      - key: NEXT_PUBLIC_API_BASE
        value: https://nethrasap-api.onrender.com

  # --- Dashboard (ops Next.js app, Docker) ---
  - type: web
    name: nethrasap-dashboard
    runtime: docker
    dockerfilePath: ./infra/Dockerfile.frontend
    dockerContext: .
    plan: starter
    region: singapore
    envVars:
      - key: APP
        value: dashboard
      - key: NEXT_PUBLIC_API_BASE
        value: https://nethrasap-api.onrender.com
