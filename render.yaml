# Render Blueprint — the WHOLE Nethrasap platform on Render via Docker:
# API + worker + Redis + storefront + dashboard. Database is Neon (external).
# Cloudflare (custom domains / CDN / R2) is layered on at the very end.
#
# Deploy: Render Dashboard → New → Blueprint → connect the GitHub repo.
# Render reads this file from the repo root. See infra/DEPLOY.md for the
# full walkthrough and the env vars you must fill in (the `sync: false` ones).
#
# Service URLs are deterministic from the names below:
#   API        https://nethrasap-api.onrender.com
#   Storefront https://nethrasap-storefront.onrender.com
#   Dashboard  https://nethrasap-dashboard.onrender.com
# If any name is already taken globally, Render appends a suffix — update the
# NEXT_PUBLIC_API_BASE / CORS_ORIGINS values below to match.
#
# !!! PREREQUISITES — do NOT click "Apply" until all of these exist !!!
# This blueprint assumes the supporting accounts are already provisioned:
#   - SMS/DLT: an MSG91 (or equivalent) account with an approved DLT sender ID
#     and API key. SMS_PROVIDER is set to a real provider below because the
#     backend config guard hard-fails boot on `console` under production.
#   - Cloudflare R2: bucket + credentials for the STORAGE_* vars.
#   - Custom domain: the real registrable domain (e.g. nethrasap.com) with
#     www./ops./api. subdomains. The *.onrender.com URLs must NOT be used for
#     the browser-facing values — guest carts break on them (see below).
# Fill every `sync: false` secret and replace every REPLACE_ME.* placeholder
# before the first deploy.

envVarGroups:
  - name: nethrasap-shared
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Neon pooled connection string. Paste in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # Shared JWT secret (generated once, used by api + worker).
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL_MIN
        value: "15"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      # SMS: MUST be a real provider under ENVIRONMENT=production — the config
      # guard hard-fails boot if SMS_PROVIDER=console in production. Set the
      # MSG91 (or exotel/twilio) API key and a DLT-approved sender ID BEFORE the
      # first deploy; OTP login is dead until the DLT registration is complete.
      - key: SMS_PROVIDER
        value: msg91
      - key: SMS_API_KEY
        sync: false
      # Replace NTHRSP with your actual DLT-approved sender ID before go-live.
      - key: SMS_SENDER_ID
        value: NTHRSP
      # Object storage (Cloudflare R2). Fill when R2 is enabled.
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        value: nethrasap
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false
      # First ops login — set once for the initial deploy, remove after the
      # admin exists and the password has been rotated in the dashboard.
      - key: BOOTSTRAP_ADMIN_PHONE
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # COD-only at launch (locked business decision). Razorpay stays dormant
      # until gateway payments are explicitly enabled.
      - key: PAYMENT_METHODS_ENABLED
        value: cod
      # Payments (Razorpay). Fill with test keys, then live keys at go-live.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

services:
  # --- Redis (pub/sub for realtime + arq queue + rate limiting) ---
  - type: keyvalue
    name: nethrasap-redis
    plan: starter
    ipAllowList: [] # internal-only (reachable by api + worker on the private network)

  # --- API + WebSocket hub ---
  - type: web
    name: nethrasap-api
    runtime: docker
    dockerfilePath: ./infra/Dockerfile.backend
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /api/v1/health
    # Runs against the NEW image before it takes traffic — safe & idempotent.
    # bootstrap_admin creates the first admin from BOOTSTRAP_ADMIN_* env vars
    # and self-skips once any admin exists (or when the vars are unset).
    preDeployCommand: "alembic upgrade head && python -m scripts.seed_rbac && python -m scripts.bootstrap_admin"
    envVars:
      - fromGroup: nethrasap-shared
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nethrasap-redis
          property: connectionString
      # Browser origins allowed to call the API. MUST be the real custom domains,
      # NOT the *.onrender.com URLs: the guest-cart cookie is SameSite=Lax and
      # each *.onrender.com host is a different site (Public Suffix List), so the
      # cookie is never sent and guest carts silently fail. www./ops./api. under
      # one registrable domain are same-site and cookies flow. Replace before deploy.
      - key: CORS_ORIGINS
        value: https://www.REPLACE_ME.com,https://ops.REPLACE_ME.com

  # --- Background worker (SMS, invoice/payslip PDFs, payroll, webhooks) ---
  - type: worker
    name: nethrasap-worker
    runtime: docker
    dockerfilePath: ./infra/Dockerfile.backend
    dockerContext: .
    dockerCommand: "arq app.worker.WorkerSettings"
    plan: starter
    region: singapore
    envVars:
      - fromGroup: nethrasap-shared
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: nethrasap-redis
          property: connectionString

  # --- Storefront (customer Next.js app, Docker) ---
  # APP + NEXT_PUBLIC_API_BASE are declared as ARG in Dockerfile.frontend and
  # Render passes matching env vars as Docker build args. NEXT_PUBLIC_API_BASE
  # is baked into the client bundle so the browser calls the API directly.
  - type: web
    name: nethrasap-storefront
    runtime: docker
    dockerfilePath: ./infra/Dockerfile.frontend
    dockerContext: .
    plan: starter
    region: singapore
    envVars:
      - key: APP
        value: storefront
      # Baked into the client bundle at BUILD time — MUST be the custom API
      # domain, not *.onrender.com (guest carts break on platform URLs via the
      # SameSite/PSL rule above). Set before the first frontend build.
      - key: NEXT_PUBLIC_API_BASE
        value: https://api.REPLACE_ME.com
      # Where staff signed in on the storefront are sent to reach the ops portal.
      # Custom ops domain (e.g. https://ops.nethrasap.com).
      - key: NEXT_PUBLIC_DASHBOARD_URL
        value: https://ops.REPLACE_ME.com

  # --- Dashboard (ops Next.js app, Docker) ---
  - type: web
    name: nethrasap-dashboard
    runtime: docker
    dockerfilePath: ./infra/Dockerfile.frontend
    dockerContext: .
    plan: starter
    region: singapore
    envVars:
      - key: APP
        value: dashboard
      # Baked into the client bundle at BUILD time — MUST be the custom API
      # domain, not *.onrender.com. Set before the first frontend build.
      - key: NEXT_PUBLIC_API_BASE
        value: https://api.REPLACE_ME.com
