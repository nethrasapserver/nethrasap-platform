# Local development stack.
#
#   docker compose up -d                      → infra only (Postgres + Redis);
#                                               run the apps on the host (make dev, etc.)
#   docker compose --profile app up -d --build → the FULL platform in containers:
#                                               API + worker + storefront + dashboard
#
# The api/worker read ../.env (Neon DATABASE_URL, JWT, …); REDIS_URL is
# overridden to reach the redis container over the compose network.
# In production these map to Render (api/worker/redis) and Cloudflare Pages
# (frontends) — nothing here deploys.
services:
  postgres:
    image: postgres:16-alpine
    container_name: nethrasap-postgres
    environment:
      POSTGRES_USER: nethrasap
      POSTGRES_PASSWORD: dev_only_password
      POSTGRES_DB: nethrasap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nethrasap -d nethrasap"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nethrasap-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local S3-compatible object storage — stands in for Cloudflare R2 in dev so
  # image/document uploads (CMS art, product images, KYC, invoices) work
  # end-to-end. API port 9000, web console 9001 (root creds below).
  minio:
    image: minio/minio:latest
    container_name: nethrasap-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nethrasap
      MINIO_ROOT_PASSWORD: dev_only_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the bucket and make the public prefixes anonymously
  # readable (so <img src> from the storefront/dashboard loads without signing).
  # KYC/invoice objects stay private and are read via short-lived signed GETs.
  minio-init:
    image: minio/mc:latest
    container_name: nethrasap-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 nethrasap dev_only_password &&
      mc mb --ignore-existing local/nethrasap &&
      mc anonymous set download local/nethrasap/products &&
      mc anonymous set download local/nethrasap/cms &&
      echo 'MinIO bucket ready.'
      "

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    container_name: nethrasap-api
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      # Local object storage (MinIO). The backend reaches MinIO over the compose
      # network (minio:9000); presigned URLs handed to the browser use the
      # published host (localhost:9000). See config.storage_public_endpoint.
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      STORAGE_BUCKET: nethrasap
      STORAGE_ACCESS_KEY_ID: nethrasap
      STORAGE_SECRET_ACCESS_KEY: dev_only_password
      STORAGE_PUBLIC_BASE_URL: /api/v1/media
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    container_name: nethrasap-worker
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      # Worker writes server-generated files (invoices/payslips) to MinIO. It
      # never signs browser URLs, so the public endpoint is unnecessary here.
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: nethrasap
      STORAGE_ACCESS_KEY_ID: nethrasap
      STORAGE_SECRET_ACCESS_KEY: dev_only_password
      STORAGE_PUBLIC_BASE_URL: /api/v1/media
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  storefront:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
      args:
        APP: storefront
        API_PROXY_TARGET: "http://api:8000"
        # Browser-facing URL of the ops portal (staff banner link).
        NEXT_PUBLIC_DASHBOARD_URL: "http://localhost:3001"
    container_name: nethrasap-storefront
    # Build arg covers the baked Next rewrites; SSR server components read
    # API_PROXY_TARGET at RUNTIME (lib/api.ts serverApi), so it must also be
    # set on the running container.
    environment:
      API_PROXY_TARGET: "http://api:8000"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  dashboard:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
      args: { APP: dashboard, API_PROXY_TARGET: "http://api:8000" }
    container_name: nethrasap-dashboard
    environment:
      API_PROXY_TARGET: "http://api:8000"
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
