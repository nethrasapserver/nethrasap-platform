[project]
name = "nethrasap-backend"
version = "0.1.0"
description = "Nethrasap backend — FastAPI + SQLAlchemy 2.0 + Postgres."
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = { text = "UNLICENSED" }

dependencies = [
  "fastapi[standard]==0.115.*",
  "uvicorn[standard]==0.32.*",
  "sqlalchemy[asyncio]==2.0.*",
  "asyncpg==0.30.*",
  "alembic==1.14.*",
  "pydantic==2.9.*",
  "pydantic-settings==2.6.*",
  "passlib[argon2]==1.7.*",
  "argon2-cffi==23.1.*",
  "PyJWT==2.10.*",
  "redis==5.2.*",
  "structlog==24.4.*",
  "python-multipart==0.0.*",
  "httpx==0.27.*",
  "arq==0.26.*",
  "boto3==1.35.*",
  "reportlab==4.2.*",
  # Observability (M2). prometheus-client is a lightweight in-process metrics
  # library (no account). sentry-sdk stays dormant until SENTRY_DSN is set.
  "prometheus-client==0.21.*",
  "sentry-sdk[fastapi]==2.*",
]

[dependency-groups]
dev = [
  "pytest==8.3.*",
  "pytest-asyncio==0.24.*",
  "ruff==0.7.*",
  "mypy==1.13.*",
  "types-passlib==1.7.*",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["app", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
plugins = []

[[tool.mypy.overrides]]
module = "passlib.*"
ignore_missing_imports = true
